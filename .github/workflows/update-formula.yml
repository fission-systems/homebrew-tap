name: Update formula

# Pull the formula from Fission's latest release and commit it here.
#
# The formula is generated by Fission's CD and attached to each release
# (fission-cli.rb + .sha256). Pulling it from this side needs no
# cross-repository credential: release assets of a public repository are
# readable with this workflow's own token, and writing here needs only
# `contents: write` on this repository.
#
# GitHub pauses scheduled workflows after 60 days without repository
# activity; run this by hand (Actions -> Update formula -> Run workflow) to
# pick up a release immediately or after such a pause.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-formula
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the latest release's formula
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(gh release view --repo fission-systems/Fission --json tagName --jq .tagName)
          work=$(mktemp -d)
          gh release download "$tag" --repo fission-systems/Fission \
            -p fission-cli.rb -p fission-cli.rb.sha256 -D "$work"
          (cd "$work" && sha256sum -c fission-cli.rb.sha256)
          ruby -c "$work/fission-cli.rb"
          grep -q "version \"${tag#v}\"" "$work/fission-cli.rb" || {
            echo "formula version does not match release ${tag}" >&2
            exit 1
          }
          cp "$work/fission-cli.rb" Formula/fission-cli.rb
          if git diff --quiet; then
            echo "Formula already at ${tag}."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "fission-cli ${tag}"
          git push
